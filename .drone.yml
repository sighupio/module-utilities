name: Check for license presence
kind: pipeline
type: docker

node:
  performance: low

clone:
  depth: 1

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  - name: check
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - mise run check-license

---
name: validate
kind: pipeline
type: docker

node:
  performance: low

depends_on:
  - Check for license presence

clone:
  depth: 1

platform:
  os: linux
  arch: amd64

environment:
  MISE_DATA_DIR: /mise-data

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  - name: render
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    depends_on:
      - clone
    commands:
      - eval "$(mise activate bash --shims)"
      - kustomize build katalog/headlamp > headlamp.yml
      - kustomize build examples/token-auth > /dev/null
      - kustomize build examples/oidc-capsule > /dev/null
      - kustomize build examples/oidc-rbac > /dev/null

  - name: lint
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    depends_on:
      - render
    commands:
      - mise run lint

  - name: check-deprecated-apis-headlamp
    image: us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5
    pull: always
    depends_on:
      - lint
    commands:
      # we use --ignore-deprecations because we don't want the CI to fail when the API has not been removed yet.
      - /pluto detect $${KUBERNETES_MANIFESTS} --ignore-deprecations --target-versions=k8s=v1.36.0
    environment:
      KUBERNETES_MANIFESTS: headlamp.yml

---
name: E2E Tests on kind clusters version 1.33.0
kind: pipeline
type: docker

platform:
  os: linux
  arch: amd64

depends_on:
  - validate

clone:
  depth: 1

trigger:
  ref:
    include:
      - refs/tags/**

environment:
  MISE_DATA_DIR: /mise-data
  KUBE_VERSION: 1.33.0
  KUBECONFIG: kubeconfig-e2e
  KUBECTL_VERSION: 1.33.4

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  - name: Create Kind Cluster
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    network_mode: host
    depends_on:
      - clone
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        flock -w 600 /mise-data/.mise-install.lock mise use kubectl@$${KUBECTL_VERSION} kind@0.33.0
        eval "$(mise activate bash --shims)"
      - ./scripts/create-e2e-cluster.sh

  - name: Run E2E Tests
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    network_mode: host
    depends_on:
      - Create Kind Cluster
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        flock -w 600 /mise-data/.mise-install.lock mise use kubectl@$${KUBECTL_VERSION} kustomize@5.6.0 bats@1.14.0 envsubst@1.4.3
        eval "$(mise activate bash --shims)"
      - ./scripts/run-e2e-tests.sh

  - name: Destroy Kind Cluster
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    network_mode: host
    depends_on:
      - Run E2E Tests
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        flock -w 600 /mise-data/.mise-install.lock mise use kubectl@$${KUBECTL_VERSION} kind@0.33.0
        eval "$(mise activate bash --shims)"
      - ./scripts/cleanup-e2e-cluster.sh
    when:
      status:
        - success
        - failure

