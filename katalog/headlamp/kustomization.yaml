---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headlamp

# Labels added to every resource. includeSelectors stays false (the default), so kustomize
# does not change the Deployment and Service selectors, which are immutable and already set
# in the manifests. For the same reason the version label is set in each resource, not here.
labels:
  - pairs:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
    includeSelectors: false

# The SD Headlamp image: upstream Headlamp with the SD plugins.
# Pinned to a published build: keep newTag equal to the image tag in deployment.yaml.
# To use another build, override newName and newTag in an overlay or run `kustomize edit set image`.
images:
  - name: registry.sighup.io/fury/sd-ui
    newTag: v0.1.1

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml
