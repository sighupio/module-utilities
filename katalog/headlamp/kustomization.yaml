---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headlamp

# Identity labels stamped on every resource. includeSelectors is left false (the default)
# so the immutable Deployment/Service selectors - already set in the manifests - are never
# mutated. Version is set per-resource, never here, for the same reason.
labels:
  - pairs:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
    includeSelectors: false

# The SD Headlamp image (Headlamp base + SD plugins, built from the sd-ui repository's Dockerfile).
# Pinned to a published build: keep newTag in sync with the image tag in deployment.yaml.
# Override newName/newTag in an overlay or with `kustomize edit set image` to use another build.
images:
  - name: registry.sighup.io/fury/sd-ui
    newTag: v0.1.1

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml
