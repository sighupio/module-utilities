apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/version: "0.40.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/instance: headlamp
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: true
      securityContext: {}
      containers:
        - name: headlamp
          # Compliant with the Kubernetes "restricted" Pod Security Standard and with the
          # Kyverno restricted policies of SD clusters.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 100
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # The tag comes from the `images:` transformer in kustomization.yaml.
          image: registry.sighup.io/fury/sd-ui
          imagePullPolicy: IfNotPresent
          # Headlamp calls the in-cluster API server and sends it the bearer token of the
          # user. The oidc-capsule example patches the Deployment to call Capsule Proxy.
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          livenessProbe:
            httpGet:
              path: "/"
              port: http
          readinessProbe:
            httpGet:
              path: "/"
              port: http
          resources: {}
