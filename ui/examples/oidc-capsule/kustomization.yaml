---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level `namespace:` on purpose: the base stays in `headlamp` while the Ingress
# below lives in `pomerium` (its namespace is set explicitly in ingress.yaml).
resources:
  - ../../katalog/headlamp
  - ingress.yaml

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: headlamp
