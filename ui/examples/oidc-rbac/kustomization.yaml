---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level `namespace:` on purpose: the base stays in `headlamp` while the Ingress
# below lives in `pomerium` (its namespace is set explicitly in ingress.yaml), and the
# RBAC objects are cluster-scoped / target kube-system.
#
# Unlike `oidc-capsule`, there is NO patch-deployment.yaml: the base Deployment already
# runs `-in-cluster` against the real API server (kubernetes.default.svc), which is exactly
# what this mode needs. Pomerium (in front, via the Ingress) injects the user's OIDC
# id_token as `Authorization: Bearer ...`; Headlamp forwards it unchanged to the API
# server, which validates it (see README) and applies plain RBAC per user/group.
resources:
  - ../../katalog/headlamp
  - ingress.yaml
  - rbac.yaml
