# RBAC for the "SSO with OIDC token, without Capsule" model (see README).
#
# WHO gets the permissions: a real OIDC group from the `groups` claim of the user (from Dex).
# It is NOT `capsule.clastix.io`: that group exists only when Capsule Proxy is in the path.
# Replace `sd-ui-viewers` below with a group that your Dex connector sends (for example an
# LDAP group CN), with the groups prefix of the API server if there is one (for example
# `oidc:`). Everybody in that group gets these permissions when they log in through Pomerium.
#
# WHAT they get: READ access to the whole cluster. Without Capsule Proxy, plain RBAC cannot
# filter by namespace: a `list` on the whole cluster returns everything or is denied. So
# every bound user sees the whole cluster. This is NOT tenant isolation. For tenant
# isolation, use the oidc-capsule example.
#
# The verbs and resources match the API calls of the SD plugins. Compared with the Capsule
# example, the only additions are the `list` verbs on the whole cluster, because there is no
# Capsule Proxy to filter the results.

---
# Read access to the whole cluster, for the plugins that list cluster scoped resources
# (sd-core landing page, sd-events, sd-logs, sd-policy).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sd-ui-reader
rules:
  # Core resources listed/watched by the plugins.
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - events
      - endpoints
      - persistentvolumeclaims
      - configmaps
    verbs: ["get", "list", "watch"]
  # Node CPU/memory tiles on the sd-core landing page (Node.useMetrics -> metrics.k8s.io).
  # Served by metrics-server; without this the tiles render empty.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Workloads shown by sd-core / sd-logs / sd-events.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Ingress links surfaced by sd-core.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # Kyverno PolicyReports (sd-policy).
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list"]
  # Gatekeeper constraints (sd-policy).
  - apiGroups: ["constraints.gatekeeper.sh"]
    resources: ["*"]
    verbs: ["get", "list"]
  # Velero backups/schedules/restores (sd-backups).
  - apiGroups: ["velero.io"]
    resources: ["backups", "schedules", "restores"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sd-ui-reader
subjects:
  - kind: Group
    name: sd-ui-viewers # <-- replace with a real Dex/LDAP group from the `groups` claim
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sd-ui-reader
---
# services/proxy access to the observability backends (sd-logs, sd-certificates, sd-events).
# The default `view` role does not include services/proxy, so this role grants it.
# resourceNames must include both the plain name and the name with the port.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sd-ui-service-proxy
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - "loki-stack"
      - "loki-stack:3100"
      - "prometheus-k8s"
      - "prometheus-k8s:9090"
      - "opensearch-cluster-master"
      - "opensearch-cluster-master:9200"
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sd-ui-service-proxy
subjects:
  - kind: Group
    name: sd-ui-viewers # <-- replace with a real Dex/LDAP group from the `groups` claim
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sd-ui-service-proxy
---
# sd-core reads the distribution data from the furyctl Secrets. `view` does not include
# Secrets, so this Role grants `get` on these two Secrets only, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sd-ui-furyctl-secrets-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["furyctl-kfd", "furyctl-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sd-ui-furyctl-secrets-reader
  namespace: kube-system
subjects:
  - kind: Group
    name: sd-ui-viewers # <-- replace with a real Dex/LDAP group from the `groups` claim
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sd-ui-furyctl-secrets-reader
