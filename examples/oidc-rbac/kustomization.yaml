---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# There is no `namespace:` field on purpose: the base resources stay in `headlamp`, the
# Ingress is in `pomerium` (ingress.yaml sets its namespace), and the RBAC resources are
# cluster scoped or in kube-system.
#
# Unlike `oidc-capsule`, there is NO patch-deployment.yaml: the base Deployment already
# runs `-in-cluster` against the real API server (kubernetes.default.svc), and this is what
# this model needs. Pomerium, in front of Headlamp, adds the OIDC id_token of the user as
# `Authorization: Bearer ...`. Headlamp sends it unchanged to the API server, which
# validates it (see README) and applies plain RBAC to the user and the groups.
resources:
  - ../../katalog/headlamp
  - ingress.yaml
  - rbac.yaml
