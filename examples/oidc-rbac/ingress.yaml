# This Ingress is in the `pomerium` namespace and sends the requests to the Pomerium
# Service, NOT to Headlamp. Pomerium authenticates the user (OIDC, Dex) and adds the bearer
# token before it sends the request to Headlamp. It needs the Pomerium route described in
# the README.
#
# Same as the oidc-capsule Ingress. The two examples differ only in what Headlamp calls:
# the API server here, Capsule Proxy in oidc-capsule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: pomerium
  labels:
    cluster.kfd.sighup.io/useful-link.enable: "true"
  annotations:
    cluster.kfd.sighup.io/useful-link.url: https://headlamp.example.com
    cluster.kfd.sighup.io/useful-link.name: "Headlamp"
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/appName: "Headlamp"
    # Placeholder: set the name of your cert-manager ClusterIssuer.
    cert-manager.io/cluster-issuer: example-issuer
spec:
  ingressClassName: nginx
  rules:
    # Replace with your real hostname before applying.
    - host: headlamp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pomerium
                port:
                  number: 80
  tls:
    - hosts:
        - headlamp.example.com
      secretName: headlamp-tls
