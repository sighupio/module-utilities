# Points Headlamp at Capsule Proxy instead of the API server, and mounts a token and a CA
# bundle, so that Headlamp trusts the TLS certificate of Capsule Proxy. Pomerium, in front of
# Headlamp, adds the OIDC id_token of the user as `Authorization: Bearer ...`. Headlamp sends
# it unchanged to Capsule Proxy, which filters every response by the Tenant of the user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
spec:
  template:
    spec:
      containers:
        - name: headlamp
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: capsule-proxy.capsule-system.svc
            - name: KUBERNETES_SERVICE_PORT
              value: "9001"
          args:
            - "-in-cluster"
            - "-in-cluster-context-name=main"
            - "-plugins-dir=/headlamp/plugins"
          volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: token-ca
      volumes:
        - name: token-ca
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 86400
                  path: token
              # Capsule Proxy CA. You create this Secret, see prerequisite 5 in the README.
              - secret:
                  name: headlamp-ca-bundle
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
