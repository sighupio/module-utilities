---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# There is no `namespace:` field on purpose: the base resources stay in `headlamp`, and the
# Ingress is in `pomerium` (ingress.yaml sets its namespace).
resources:
  - ../../katalog/headlamp
  - ingress.yaml

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: headlamp
