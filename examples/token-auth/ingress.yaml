# TLS Ingress that sends the requests to the Headlamp Service. There is no authentication
# on the Ingress: the Kubernetes token login of Headlamp protects the UI (see README).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    # Placeholder: set the name of your cert-manager ClusterIssuer.
    cert-manager.io/cluster-issuer: example-issuer
spec:
  ingressClassName: nginx
  rules:
    # Replace with your real hostname before applying.
    - host: headlamp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
  tls:
    - hosts:
        - headlamp.example.com
      secretName: headlamp-tls
