# Gives permissions on the whole cluster to the Headlamp ServiceAccount. Headlamp sends the
# token of the user to the API server, so this binding applies when a user logs in with the
# token of this ServiceAccount. Replace cluster-admin with a read only ClusterRole (for
# example the default `view`) to limit what that token can do.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
